name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      # Vite inlines VITE_* into the bundle at build time, so these must be
      # present here — there is no runtime env for static files. A missing one
      # compiles to `undefined` rather than failing, which is why the API URL
      # silently became a relative path once before.
      - name: Install dependencies and build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_INGESTION_URL: ${{ vars.VITE_INGESTION_URL }}
          VITE_PARTY_API_KEYS: ${{ vars.VITE_PARTY_API_KEYS }}
          VITE_INGESTION_API_KEY: ${{ vars.VITE_INGESTION_API_KEY }}
        run: |
          npm install
          npm run build
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_POND_06C318900 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          # Upload the dist/ built by the step above rather than letting the
          # action rebuild — its own build never sees the env block, and would
          # ship a bundle with the VITE_* values missing.
          #
          # skip_app_build makes app_location the folder that gets uploaded and
          # output_location is ignored, so this must be "dist". Pointing it at
          # "/" uploads the whole workspace, and node_modules alone is ~29k
          # files against a ~15k per-deployment limit.
          skip_app_build: true
          app_location: "dist"
          api_location: ""
          output_location: ""

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_POND_06C318900 }}
          action: "close"
